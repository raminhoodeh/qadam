[project]
name = "qadam"
version = "0.1.0"
description = "Local-first Qadam trading intelligence foundation"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10",
  "asyncpg>=0.29",
  "chromadb>=0.5",
  "fastmcp>=2.0",
  "httpx>=0.27",
  "keyring>=25.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "sentry-sdk>=2.0",
  "structlog>=24.0",
  "uvloop>=0.19; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator", "world_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
