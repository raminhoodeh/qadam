services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: qadam-postgres
    environment:
      POSTGRES_DB: qadam
      POSTGRES_USER: qadam
      POSTGRES_PASSWORD: qadam
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qadam -d qadam"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: qadam-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma

